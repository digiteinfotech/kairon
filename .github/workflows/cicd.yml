# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        chmod +x ./setup.sh
        ./setup.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        uv pip install flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # Coveralls related steps
    - name: Coverage with coveralls
      run: | 
        uv pip install coveralls
        coverage run --source=kairon -m pytest tests/ --ignore stress_test/
    - env:
        COVERALLS_PARALLEL: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Submit to coveralls.io
      run: |
        coveralls --service=github
    - name: Generate Sphinx files
      run: |
        uv pip install sphinx sphinx_rtd_theme
        cd docs
        # sphinx-quickstart
        # set system_file=../system.yaml
        export system_file=../system.yaml
        export EMAIl_CONF=../email.yaml
        make html
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      if: github.ref == 'refs/heads/master'
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Copy files to the website
      if: github.ref == 'refs/heads/master'
      run: |
        aws s3 sync docs/_build/html s3://${{ secrets.S3_PATH }}
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
