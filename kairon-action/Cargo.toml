[package]
name = "kairon-action"
version = "0.1.0"
edition = "2021"
description = "Kairon action server"
publish = false

[lib]
name = "kairon_action"
path = "src/lib.rs"

[[bin]]
name = "kairon-action"
path = "src/main.rs"

[dependencies]
actix-web = "4"
async-trait = "0.1"
aes = "0.8"
base64 = "0.22"
bson = "2"
cbc = "0.1"
chrono = { version = "0.4", features = ["clock"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ctr = "0.9"
futures-util = "0.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
mongodb = "3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
