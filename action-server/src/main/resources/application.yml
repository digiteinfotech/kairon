micronaut:
  application:
    name: kairon-action
  server:
    port: 5055
    # The Python server (uvicorn) has no body-size limit. Micronaut defaults to 10 MB, which rejects a
    # 20 MB tracker with 413. Ceiling below needs human sign-off (cavekit-webhook-contract.md R6); see CONFIG.md.
    max-request-size: 64MB
    # Micronaut >= 4.5 buffers @Body String up to this separate limit (default 10 MB); keep it equal.
    max-request-buffer-size: 64MB
    # CORS is handled by SecurityFilter from kairon.action.cors-origin (ALLOWED_ORIGIN), mirroring Starlette's
    # CORSMiddleware(allow_origins=cors.origin, allow_credentials=True, allow_methods=["*"], allow_headers=["*"]).
    # localhost-pass-through: Micronaut otherwise answers 403 to a cross-origin request whose Host is localhost
    # even with CORS disabled; the Python server has no such check.
    # Starlette GZipMiddleware() defaults (kairon/actions/server.py, starlette 0.41.3): minimum_size=500,
    # compresslevel=9. Micronaut defaults are 1024 and 6.
    netty:
      compression-threshold: 500
      compression-level: 9
    cors:
      enabled: false
      localhost-pass-through: true

jackson:
  serialization-inclusion: ALWAYS

# Env var names and defaults mirror the Python system.yaml keys (see CONFIG.md).
# Defaults containing ':' are wrapped in backticks, or Micronaut reads them as nested placeholders.
# Secrets (FERNET_KEY, SECRET_KEY, ASYNC_CALLBACK_AES_KEY, ASYNC_CALLBACK_AES_IV, LIVE_AGENT_AUTH_TOKEN)
# deliberately have no default here.
kairon:
  action:
    catalog: ${KAIRON_ACTION_CATALOG:mongo}
    rasa-sdk-version: "3.6.21"
    request-timeout: ${ACTION_SERVER_REQUEST_TIMEOUT:60}
    action-server-url: ${ACTION_SERVER_URL:`http://localhost:5055/webhook`}
    callback-base-url: ${ASYNC_CALLBACK_ACTION_SERVER_URL:`http://localhost:5059/callback`}
    events-server-url: ${EVENT_SERVER_ENDPOINT:`http://localhost:5056`}
    web-search-url: ${WEB_SEARCH_URL:}
    evaluator-url: ${EXPRESSION_EVALUATOR_ENDPOINT:`http://192.168.100.109:8085/evaluate`}
    pyscript-url: ${TRIGGER_MAIN_PYSCRIPT_URL:`http://localhost:5059/main_pyscript/execute-python`}
    live-agent-url: ${LIVE_AGENT_SERVER_URL:`http://localhost:8000/api/v1`}
    live-agent-token: ${LIVE_AGENT_AUTH_TOKEN:}
    live-agent-enabled: true
    vector-url: ${VECTOR_DB:}
    llm-url: ${LLM_SERVER_URL:}
    simple-agent-url: ${SIMPLE_AGENT_URL:}
    voice-call-url: ${KAIRON_VOICE_CALL_URL:}
    frontend-url: ${FRONTEND_URL:`http://localhost:3000`}
    support-mail: ${KAIRON_SUPPORT_MAIL:kairon@digite.com}
    cors-origin: '${ALLOWED_ORIGIN:["*"]}'
    fernet-key: ${FERNET_KEY:}
    jwt-secret: ${SECRET_KEY:}
    jwt-algorithm: HS256
    async-callback-aes-key: ${ASYNC_CALLBACK_AES_KEY:}
    async-callback-aes-iv: ${ASYNC_CALLBACK_AES_IV:}
    token-expire: 15
    unmasked-char-count: ${SECRET_UNMASKED_CHAR_COUNT:2}
    unmasked-char-strategy: ${SECRET_UNMASKED_CHAR_STRATEGY:from_right}

# Failure mail SMTP settings, read by support/FailureMail. Env var names and defaults mirror the Python
# email.yaml keys (see CONFIG.md). EMAIL_SENDER_PASSWORD deliberately has no default here.
email:
  sender:
    service: ${EMAIL_SENDER_SERVICE:changeit}
    port: ${EMAIL_SENDER_PORT:587}
    email: ${EMAIL_SENDER_EMAIL:changeit@changeit.com}
    password: ${EMAIL_SENDER_PASSWORD:}
    userid: ${EMAIL_SENDER_USERID:}
  templates:
    action:
      # Python key email.templates.action_failure_subject
      failure: ${EMAIL_TEMPLATES_ACTION_FAILURE:kAIron Action Failure - BOT_NAME}

mongodb:
  # database.url / DATABASE_URL. A URL without a database name uses `kairon` (MongoFactory).
  uri: ${DATABASE_URL:`mongodb://localhost:27017/conversations`}
