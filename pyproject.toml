[project]
name = "kairon"
version = "0.1.0"
description = "Conversational digital transformation platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "rasa==3.6.21",
    "mongoengine==0.29.1",
    "fastapi==0.125.0",
    "uvicorn[standard]==0.49.0",
    "smart-config==0.1.3",
    "fastapi_sso==0.15.0",
    "fastapi-keycloak==1.0.11",
    "pykka==3.1.1",
    "zenpy==2.0.50",
    "validators==0.33.0",
    "secure==0.3.0",
    "password-strength==0.0.3.post2",
    "beautifulsoup4==4.13.0b3",
    "uuid6==2024.7.10",
    "passlib==1.7.4",
    "bcrypt==4.3.0",
    "json2html==1.3.0",
    "google-api-python-client==2.143.0",
    "jira==3.8.0",
    "pipedrive-python-lib==1.2.3",
    "google-cloud-translate==3.16.0",
    "blinker==1.8.2",
    "pymupdf==1.25.3",
    "python-docx==1.1.2",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "dramatiq==1.17.0",
    "dramatiq-mongodb==0.8.3",
    "pyTelegramBotAPI==4.26.0",
    "APScheduler==3.9.1.post1",
    "croniter==2.0.7",
    "faiss-cpu==1.8.0.post1",
    "tiktoken==0.7.0",
    "torch",
    # x86_64: CPU wheel. aarch64: the tensorflow stub, which depends on tensorflow-cpu-aws.
    "tensorflow-cpu==2.12.0 ; platform_machine == 'x86_64'",
    "tensorflow==2.12.0 ; platform_machine == 'aarch64' or platform_machine == 'arm64'",
    "RestrictedPython>=7.3",
    "AccessControl>=7.2",
    "timeout-decorator==0.5.0",
    "googlesearch-python==1.2.5",
    "aiohttp-retry==2.8.3",
    "pqdict==1.4.0",
    "google-businessmessages==1.0.5",
    "google-apitools==0.5.32",
    "orjson==3.11.6",
    "opentelemetry-distro[otlp]==0.48b0",
    "opentelemetry-sdk-extension-aws==2.0.2",
    "opentelemetry-propagator-aws-xray==1.0.2",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "opentelemetry-instrumentation-aiohttp-client==0.48b0",
    "opentelemetry-instrumentation-asyncio==0.48b0",
    "opentelemetry-instrumentation-aws-lambda==0.48b0",
    "opentelemetry-instrumentation-boto==0.48b0",
    "opentelemetry-instrumentation-botocore==0.48b0",
    "opentelemetry-instrumentation-httpx==0.48b0",
    "opentelemetry-instrumentation-logging==0.48b0",
    "opentelemetry-instrumentation-pymongo==0.48b0",
    "opentelemetry-instrumentation-requests==0.48b0",
    "opentelemetry-instrumentation-system-metrics==0.48b0",
    "opentelemetry-instrumentation-grpc==0.48b0",
    "opentelemetry-instrumentation-asgi==0.48b0",
    "pykwalify==1.8.0",
    "jsonschema_rs==0.58.3",
    "mongoengine-jsonschema==0.1.3",
    "fernet==1.0.1",
    "google-generativeai",
    "huggingface-hub==0.25.2",
    "transformers==4.36.2",
    "imap-tools==1.7.4",
    "more-itertools",
    "python-multipart>=0.0.18",
    "blacksheep==2.0.7",
    "fastembed==0.5.1",
    "markdown-pdf==1.7",
    "genson==1.3.0",
    "qdrant-client==1.13.3",
    "twilio>=8.2.0",
    "boto3>=1.34.0",
    "websockets>=10.0,<11.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest_httpx==0.30.0",
    "pytest-asyncio==0.24.0",
    "responses==0.25.6",
    "mock==5.1.0",
    "moto[all]==5.0.26",
    "mongomock==4.1.2",
    "black==22.12.0",
    "locust==2.46.0",
    "deepdiff==8.6.2",
    "pytest-cov==5.0.0",
    "pytest-html==4.1.1",
    "pytest-aioresponses==0.3.0",
    "aioresponses==0.7.6",
]

[tool.uv]
package = false
# rasa 3.6 pins numpy==1.22.3 on Windows, which cannot coexist with pandas 2.2.
# Docker and CI are Linux, so the lock is solved for Linux only.
environments = ["sys_platform == 'linux'"]
# PyPI tensorflow 2.12's x86_64 wheel is the large CUDA build. Drop that
# requirement from rasa and tensorflow-text; the pins above select the CPU build.
exclude-dependencies = [
    { package = { name = "rasa", version = "3.6.21" }, dependencies = ["tensorflow"] },
    { package = { name = "tensorflow-text", version = "2.12.0" }, dependencies = ["tensorflow"] },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
