[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest_httpx==0.36.2",
    "pytest-asyncio==1.4.0",
    "responses==0.26.3",
    "mock==5.2.0",
    "moto[all]==5.2.4",
    "mongomock==4.3.0",
    "black==26.10.1",
    "locust==2.46.7",
    "deepdiff==9.1.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-aioresponses==0.3.0",
    "aioresponses==0.7.9",
]

[tool.uv]
package = false
# Docker and CI are Linux. The lock is solved for Linux only.
environments = ["sys_platform == 'linux'"]
# The Rasa fork pins several of these exactly. Overrides keep Kairon's newer
# releases. aiohttp stays on 3.11.18 because aiogram 2.25 pins aiohttp<3.9,
# which has no Python 3.12 wheels.
override-dependencies = [
    "aiohttp==3.11.18",
    "httptools==0.9.0",
    "websockets==17.2",
    "requests==2.34.2",
    "python-engineio==4.14.0",
    "twilio==9.12.0",
    "boto3==1.43.114",
    "botocore==1.43.114",
    "s3transfer==0.19.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
rasa = { git = "https://github.com/sfahad1414/rasa.git" }
# This Rasa commit requires pydantic==2.13.5. rasa-sdk HEAD requires pydantic==2.14.1.
rasa-sdk = { git = "https://github.com/sfahad1414/rasa-sdk.git", rev = "3574f783ad33ad801548e284306a5c2424aa0234" }
mitie = { git = "https://github.com/mit-nlp/MITIE.git" }
