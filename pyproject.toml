    "mongoengine==0.29.3",
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "smart-config==0.1.3",
    "fastapi_sso==0.23.0",
    "fastapi-keycloak==1.1.1",
    "pykka==4.5.0",
    "zenpy==2.0.57",
    "validators==0.36.0",
    "secure==2.0.1",
    "password-strength==0.0.3.post2",
    "beautifulsoup4==4.15.0",
    "uuid6==2025.0.1",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "json2html==1.3.0",
    "google-api-python-client==2.201.0",
    "jira==3.10.5",
    "pipedrive-python-lib==1.2.3",
    "google-cloud-translate==3.28.0",
    "blinker==1.9.0",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "dramatiq==1.18.0",
    "dramatiq-mongodb==0.8.3",
    "pyTelegramBotAPI==4.37.0",
    "APScheduler==3.11.3",
    "croniter==6.2.4",
    "faiss-cpu==1.15.1",
    "tiktoken==0.14.0",
    "torch",
    "RestrictedPython==8.5",
    "AccessControl==7.5",
    "timeout-decorator==0.5.0",
    "googlesearch-python==1.3.0",
    "aiohttp-retry==2.9.1",
    "pqdict==1.5.1",
    "google-businessmessages==1.0.5",
    "google-apitools==0.5.35",
    "orjson==3.13.0",
    "opentelemetry-distro[otlp]==0.66b0",
    "opentelemetry-sdk-extension-aws==2.1.0",
    "opentelemetry-propagator-aws-xray==1.0.2",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-aiohttp-client==0.66b0",
    "opentelemetry-instrumentation-asyncio==0.66b0",
    "opentelemetry-instrumentation-aws-lambda==0.66b0",
    "opentelemetry-instrumentation-botocore==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
    "opentelemetry-instrumentation-pymongo==0.66b0",
    "opentelemetry-instrumentation-requests==0.66b0",
    "opentelemetry-instrumentation-system-metrics==0.66b0",
    "opentelemetry-instrumentation-grpc==0.66b0",
    "opentelemetry-instrumentation-asgi==0.66b0",
    "pykwalify==1.8.0",
    "jsonschema_rs==0.58.6",
    "mongoengine-jsonschema==0.1.3",
    "fernet==1.0.1",
    "huggingface-hub==0.36.2",
    "transformers==4.57.6",
    "imap-tools==1.16.0",
    "more-itertools==11.2.1",
    "python-multipart==0.0.32",
    "blacksheep==2.6.4",
    "fastembed==0.9.0",
    "markdown-pdf==1.13.3",
    "genson==1.4.0",
    "qdrant-client==1.19.1",
    "twilio==9.12.0",
    "boto3==1.43.114",
    "websockets==17.2",
